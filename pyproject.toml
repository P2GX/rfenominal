[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "fenominal"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython"
]
keywords = ["Human Phenotype Ontology", "hpo", "phenotype"]
dynamic = ["version"]

[tool.maturin]
# Direct maturin to use the python feature flag during compilation
features = ["python"]