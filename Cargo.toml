[package]
name = "fenominal"
version = "0.2.11"

description = "HPO-based text mining. Rust version of fenominal"
edition = "2021"


[[bin]]
name = "fenominal_main"
path = "src/bin/fenominal_main.rs"
features = ["serde"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
deunicode = "1.6.2"
fuzzy-matcher = "0.3"
once_cell = "1.21.4"
ontolius = { version = "0.7.4", features = ["csr", "obographs"] }
regex = "1.12.3"
rstest = "0.26.1"
serde = { version = "1.0.228", optional = true }
serde_json = { version = "1.0.150", optional = true }
thiserror = "2.0.18"

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json"]


[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1.9"
once_cell = "1.21.3"
rstest = "0.26.1"
